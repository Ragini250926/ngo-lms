{% extends "base.html" %}{% block title %}Modules{% endblock %}{% block content %}<section class="section"><div class="container two"><div class="card"><h2>Add module</h2><form method="post"><label>Title<input name="title" required></label><label>Description<textarea name="description"></textarea></label><label>Order<input name="order_no" type="number" value="1"></label><button class="btn">Add</button></form></div><div>{% for m in modules %}<div class="card"><h3>{{m.title}}</h3><a href="{{url_for('materials',mid=m.id)}}">Materials →</a></div>{% endfor %}</div></div></section>{% endblock %}
