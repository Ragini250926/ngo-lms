{% extends "base.html" %}{% block title %}Users{% endblock %}{% block content %}<section class="section"><div class="container"><h1>Manage Users</h1><div class="card table"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr>{% for u in users %}<tr><td>{{u.name}}</td><td>{{u.email}}</td><td>{{u.role}}</td><td>{{'Active' if u.active else 'Inactive'}}</td><td>{% if u.role!='admin' %}<form method="post" action="{{url_for('toggle_user',uid=u.id)}}"><button class="btn sm">Toggle</button></form>{% endif %}</td></tr>{% endfor %}</table></div></div></section>{% endblock %}
