{% extends "base.html" %}{% block title %}Learning Material{% endblock %}{% block content %}<section class="page"><div class="container"><h1>{{module.title}}</h1><p>{{module.description}}</p></div></section><section class="section"><div class="container">{% for m in module.materials %}<div class="card"><span class="tag">{{m.material_type}}</span><h2>{{m.title}}</h2><p>{{m.content}}</p>{% if m.resource_url %}<a href="{{m.resource_url}}" target="_blank">Open resource →</a>{% endif %}</div>{% endfor %}<form method="post" action="{{url_for('complete_module',mid=module.id)}}"><button class="btn">Mark module as completed</button></form></div></section>{% endblock %}
