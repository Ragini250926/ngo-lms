{% extends "base.html" %}{% block title %}Quiz Result{% endblock %}{% block content %}<section class="section center"><div class="container card"><h1>{{result.percentage}}%</h1><h2>{{'Passed' if result.passed else 'Try again'}}</h2><p>{{result.score}} / {{result.total}} correct.</p><a class="btn" href="{{url_for('course',cid=quiz.course_id)}}">Back to course</a></div></section>{% endblock %}
