{% extends "base.html" %}{% block title %}Quizzes{% endblock %}{% block content %}<section class="section"><div class="container"><h1>Manage Quizzes</h1><div class="card"><form method="post"><label>Course<select name="course_id">{% for c in courses %}<option value="{{c.id}}">{{c.id}} — {{c.title}}</option>{% endfor %}</select></label><label>Title<input name="title" required></label><label>Passing %<input name="passing_percentage" type="number" value="60"></label><button class="btn">Create quiz</button></form></div>{% for q in quizzes %}<div class="card"><h3>{{q.title}}</h3><p>{{q.course.title}} · Passing {{q.passing_percentage}}%</p><a href="{{url_for('questions',qid=q.id)}}">Questions →</a></div>{% endfor %}</div></section>{% endblock %}
