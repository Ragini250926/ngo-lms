{% extends "base.html" %}{% block title %}Course Form{% endblock %}{% block content %}<div class="auth"><h1>{{'Edit' if course.id else 'Add'}} Course</h1><form method="post"><label>Title<input name="title" value="{{course.title or ''}}" required></label><label>Description<textarea name="description" required>{{course.description or ''}}</textarea></label><label>Category<input name="category" value="{{course.category or 'General'}}"></label><label>Difficulty<input name="difficulty" value="{{course.difficulty or 'Beginner'}}"></label><label>Duration<input name="duration" value="{{course.duration or '2 hours'}}"></label><label>Instructor<input name="instructor" value="{{course.instructor or 'NGO Learn Team'}}"></label><label><input type="checkbox" name="published" {% if course.published or not course.id %}checked{% endif %}> Published</label><button class="btn">Save</button></form></div>{% endblock %}
