{% extends "base.html" %}{% block title %}Materials{% endblock %}{% block content %}<section class="section"><div class="container two"><div class="card"><h2>Add material</h2><form method="post"><label>Title<input name="title" required></label><label>Type<select name="material_type"><option>text</option><option>video</option><option>pdf</option><option>activity</option></select></label><label>Content<textarea name="content"></textarea></label><label>URL<input name="resource_url"></label><button class="btn">Add</button></form></div><div>{% for m in module.materials %}<div class="card"><b>{{m.title}}</b><p>{{m.content}}</p></div>{% endfor %}</div></div></section>{% endblock %}
