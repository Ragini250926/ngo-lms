{% extends "base.html" %}{% block title %}Certificates{% endblock %}{% block content %}<section class="section"><div class="container"><h1>Certificates</h1>{% for c in certificates %}<div class="card"><b>{{c.certificate_id}}</b> — {{c.user.name}} — {{c.course.title}} — <a href="{{url_for('certificate',cid=c.id)}}">View</a></div>{% else %}<p>No certificates.</p>{% endfor %}</div></section>{% endblock %}
