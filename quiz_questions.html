{% extends "base.html" %}{% block title %}Questions{% endblock %}{% block content %}<section class="section"><div class="container two"><div class="card"><h2>Add question</h2><form method="post"><label>Question<textarea name="text" required></textarea></label><label>A<input name="a" required></label><label>B<input name="b" required></label><label>C<input name="c" required></label><label>D<input name="d" required></label><label>Correct<select name="correct"><option>A</option><option>B</option><option>C</option><option>D</option></select></label><button class="btn">Add</button></form></div><div>{% for q in quiz.questions %}<div class="card"><b>Q{{loop.index}}. {{q.text}}</b><p>A {{q.a}} · B {{q.b}} · C {{q.c}} · D {{q.d}}</p><small>Correct: {{q.correct}}</small></div>{% endfor %}</div></div></section>{% endblock %}
