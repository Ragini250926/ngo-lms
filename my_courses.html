{% extends "base.html" %}{% block title %}My Courses{% endblock %}{% block content %}<section class="page"><div class="container"><h1>My Courses</h1></div></section><section class="section"><div class="container grid">{% for e in enrollments %}<div class="card"><h3>{{e.course.title}}</h3><p>{{course_progress(logged_user.id,e.course_id)}}% complete</p><a class="btn sm" href="{{url_for('course',cid=e.course_id)}}">Continue</a></div>{% else %}<p>No enrolments.</p>{% endfor %}</div></section>{% endblock %}
